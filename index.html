<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shaza pptx library</title>
<script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
<style>
:root{
  --bg:#f3f2f1; --surf:#ffffff; --soft:#fafafa; --line:#e3e1df; --hd:#f0f4f8;
  --txt:#252423; --mut:#605e5c; --acc:#0F5AA8; --accSoft:#eff6fc;
  --inp:#ffffff; --inpLine:#c8c6c4; --onTxt:#ffffff; --danger:#c4314b; --dangerBg:#fde7e9;
  --box:40px;
}
body.dark{
  --bg:#1b1a19; --surf:#252423; --soft:#2a2928; --line:#3b3a39; --hd:#2f3336;
  --txt:#f3f2f1; --mut:#a19f9d; --acc:#4CC2FF; --accSoft:#13303f;
  --inp:#1f1e1d; --inpLine:#4a4948; --onTxt:#10222e; --danger:#ff8f9e; --dangerBg:#5a2a2a;
}
*{box-sizing:border-box}
body{margin:0;display:flex;flex-direction:row;height:100vh;overflow:hidden;
  font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt)}
#scroller{flex:1;min-width:0;overflow-y:auto;display:flex;flex-direction:column}

/* شريط تمرير واضح يُسحب بالماوس */
#scroller{padding-left:15px;scrollbar-width:none}
#scroller::-webkit-scrollbar{width:0;height:0}

/* شريط تمرير ظاهر دائماً ويُسحب بالماوس */
#sbar{position:fixed;left:3px;top:7px;bottom:7px;width:11px;border-radius:7px;
  background:var(--line);z-index:30;display:none;cursor:pointer}
#sthumb{position:absolute;left:1px;right:1px;top:0;height:40px;border-radius:6px;
  background:var(--mut);cursor:grab}
#sthumb:hover{background:var(--txt)}
#sthumb.drag{background:var(--acc);cursor:grabbing}

.bar{background:var(--surf);padding:8px 9px 9px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 2px 5px rgba(0,0,0,.05);z-index:5}
.head{display:flex;align-items:center;gap:6px}
.head h3{color:var(--acc);margin:0;font-size:14px;font-weight:700;flex:1;text-align:center}

.folder{display:flex;align-items:center;gap:5px;background:var(--accSoft);border:1px solid var(--line);
  border-radius:6px;padding:4px 7px;font-size:10px;color:var(--txt)}
.folder b{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .sp{margin-inline-start:auto;display:flex;gap:4px}

.mini{font-size:10px;padding:2px 6px;border:1px solid var(--inpLine);background:var(--inp);
  border-radius:4px;color:var(--acc);cursor:pointer;font-family:inherit}
.mini:hover{background:var(--accSoft)}
.mini:disabled{opacity:.5;cursor:default}

.blk{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)}
.bh{background:var(--hd);padding:4px 8px;font-size:10px;font-weight:700;color:var(--acc);
  display:flex;align-items:center;gap:5px;border-bottom:1px solid var(--line)}
.bh .sp{margin-inline-start:auto;display:flex;gap:5px;align-items:center}
.chev{color:var(--mut);font-size:9px;border:1px solid var(--inpLine);border-radius:4px;
  width:17px;height:16px;display:flex;align-items:center;justify-content:center;background:var(--inp);cursor:pointer}
.blk.closed .bb{display:none}
.blk.closed .bh{border-bottom:none}
.bb{padding:6px;display:flex;flex-direction:column;gap:6px}

.r{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.lbl{font-size:10px;color:var(--mut);font-weight:700}
input[type=number]{width:38px;font-size:11px;padding:2px;border:1px solid var(--inpLine);
  border-radius:4px;text-align:center;background:var(--inp);color:var(--txt)}
select{font-size:10px;padding:2px;border:1px solid var(--inpLine);border-radius:4px;
  background:var(--inp);color:var(--txt);font-family:inherit;max-width:100%}
input[type=color]{width:20px;height:20px;padding:0;border:1px solid var(--inpLine);border-radius:4px;
  cursor:pointer;background:none;flex:none}
input[type=checkbox]{accent-color:var(--acc)}

.cols{display:flex;gap:6px;align-items:stretch}
.pv{border-radius:7px;background:var(--surf);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none;width:54px;height:54px;overflow:hidden}
.pv img{max-width:46px;max-height:46px}

.pstrip{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
.pchip{width:42px;height:42px;border-radius:8px;background:var(--surf);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;flex:none;cursor:pointer}
.pchip:hover{border-color:var(--acc)}
.pchip:hover .x{display:flex}
.pchip.on{border:2px solid var(--acc);box-shadow:0 0 0 2px rgba(15,90,168,.16)}
.pchip img{max-width:32px;max-height:32px;pointer-events:none}
.pchip .x{display:none;position:absolute;top:-5px;inset-inline-start:-5px;width:15px;height:15px;border-radius:50%;
  background:var(--dangerBg);color:var(--danger);font-size:9px;align-items:center;
  justify-content:center;border:1px solid var(--line);cursor:pointer}
.padd{width:42px;height:42px;border-radius:8px;border:1px dashed var(--inpLine);display:flex;
  align-items:center;justify-content:center;color:var(--acc);font-size:16px;flex:none;cursor:pointer;background:none}
.pempty{font-size:9px;color:var(--mut);padding:6px 2px}

.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.sgrid label{font-size:12px;text-align:center;padding:3px 0;border:1px solid var(--inpLine);
  border-radius:5px;background:var(--inp);color:var(--mut);cursor:pointer;line-height:1.25}
.sgrid label:hover{border-color:var(--acc)}
.sgrid input{display:none}
.sgrid input:checked + span{color:var(--onTxt)}
.sgrid label.on{background:var(--acc);color:var(--onTxt);border-color:var(--acc);font-weight:700}

.swrow{display:flex;gap:4px;direction:ltr;flex-wrap:wrap}
.swatch{width:19px;height:19px;border-radius:4px;border:1px solid rgba(0,0,0,.25);cursor:pointer;position:relative}
.swatch:hover{outline:2px solid var(--acc);outline-offset:1px}
.swatch span{position:absolute;bottom:-2px;right:1px;font-size:7px;color:rgba(0,0,0,.5);font-weight:700}
.chip{font-size:9px;padding:2px 5px;border-radius:10px;border:1px solid var(--inpLine);
  background:var(--inp);color:var(--mut);cursor:pointer}
.chip.active{background:var(--acc);border-color:var(--acc);color:var(--onTxt);font-weight:700}
.theme-status{font-size:9px;color:var(--mut);line-height:1.5}

.tabs{display:flex;border-bottom:1px solid var(--line);background:var(--surf);position:sticky;top:0;z-index:6}
.tab-btn{flex:1;background:none;border:none;padding:7px 4px;cursor:pointer;font-size:12px;
  color:var(--mut);border-bottom:3px solid transparent;font-family:inherit}
.tab-btn.active{font-weight:700;color:var(--acc);border-bottom-color:var(--acc)}

.main{flex-grow:1;padding:9px;background:var(--bg)}
.btn-select{background:var(--acc);color:var(--onTxt);border:none;padding:8px;border-radius:5px;
  cursor:pointer;width:100%;font-size:12px;font-weight:700;margin-bottom:7px;font-family:inherit}
.search-box{width:100%;padding:5px 8px;font-size:11px;border:1px solid var(--inpLine);
  border-radius:4px;background:var(--inp);color:var(--txt);font-family:inherit}
.zoom{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--mut);margin:7px 0 6px}
.zoom input[type=range]{flex:1;accent-color:var(--acc);height:4px}
.batch-bar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;background:var(--surf);
  border:1px solid var(--line);border-radius:6px;padding:5px 6px;margin-bottom:8px}
.batch-bar.on{border-color:var(--acc);background:var(--accSoft)}
.batch-bar label{font-size:10px;color:var(--mut);display:flex;align-items:center;gap:3px}
.batch-bar input[type=number]{width:32px}
.batch-count{font-size:10px;font-weight:700;color:var(--acc)}
.mini.primary{background:var(--acc);color:var(--onTxt);border-color:var(--acc);font-weight:700}
.mini.primary:disabled{background:var(--inpLine);border-color:var(--inpLine)}

.group-title{font-size:10px;font-weight:700;color:var(--txt);border-bottom:2px solid var(--line);
  padding:4px 2px;display:flex;justify-content:space-between;margin:4px 0 7px;cursor:pointer}
.icon-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.icon-box{width:var(--box);height:var(--box);background:var(--surf);border:1px solid var(--line);
  border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:4px;position:relative;transition:transform .1s}
.icon-box:hover{transform:scale(1.06);border-color:var(--acc)}
.icon-box img{max-width:100%;max-height:100%;pointer-events:none}
.icon-box.selected{border:2px solid var(--acc);background:var(--accSoft)}
.icon-box.selected::after{content:'✓';position:absolute;top:-6px;inset-inline-start:-6px;background:var(--acc);
  color:var(--onTxt);font-size:9px;width:15px;height:15px;border-radius:50%;display:flex;
  align-items:center;justify-content:center}
.empty-hint{font-size:11px;color:var(--mut);text-align:center;padding:14px 8px;line-height:1.7}
body.dark .icon-box, body.dark .pv, body.dark .pchip{background:#f3f3f3;border-color:#55534f}
body.dark .icon-box:hover{border-color:var(--acc)}
body.dark .icon-box.selected{background:#dbeeff;border-color:var(--acc)}
#notification{position:fixed;bottom:12px;left:12px;right:12px;padding:8px;background:#323130;color:#fff;
  border-radius:5px;font-size:11px;text-align:center;display:none;z-index:100}
</style>
</head>
<body>
<div id="sbar"><div id="sthumb"></div></div>
<div id="scroller">
<div class="bar">
  <div class="head">
    <button class="mini" id="theme-toggle" title="تبديل الوضع الداكن">🌙</button>
    <h3>Shaza pptx library</h3>
    <span style="width:26px"></span>
  </div>

  <div class="folder">📁 <b id="folder-name">لم يُحدَّد مجلد</b>
    <span id="folder-count" style="color:var(--mut)"></span>
    <span class="sp">
      <button class="mini" id="folder-reload" title="إعادة تحميل المجلد">⟳</button>
      <button class="mini" id="folder-change">تغيير</button>
    </span>
  </div>

  <!-- كتلة الأنماط -->
  <div class="blk" id="blk-presets" data-key="presets">
    <div class="bh">🎨 الأنماط
      <span class="sp"><button class="mini" id="preset-save">حفظ</button>
      <span class="chev" data-toggle="presets">▾</span></span></div>
    <div class="bb" style="padding:6px">
      <div class="pstrip" id="preset-strip"></div>
    </div>
  </div>

  <div class="cols">
    <!-- كتلة الأيقونة -->
    <div class="blk" id="blk-icon" data-key="icon" style="flex:1.12">
      <div class="bh">🔷 الأيقونة<span class="sp"><span class="chev" data-toggle="icon">▾</span></span></div>
      <div class="bb">
        <div class="r" style="flex-wrap:nowrap;gap:6px">
          <div class="pv" id="preview-box" title="معاينة النتيجة"></div>
          <div style="display:flex;flex-direction:column;gap:5px;min-width:0">
            <div class="r" style="gap:3px"><span class="lbl">حجم</span>
              <input type="number" id="icon-width" value="50" min="10" max="200" step="1"></div>
            <select id="size-preset" title="اختيار سريع للحجم"></select>
          </div>
        </div>
        <div class="r" style="gap:4px"><span class="lbl">لون الأيقونة</span>
          <input type="color" id="icon-color" value="#4472C4">
          <span class="lbl"><input type="checkbox" id="apply-color" checked> تلوين</span></div>
        <div class="r" style="gap:4px"><span class="lbl">ثيم</span>
          <div class="swrow" id="theme-swatches"></div>
          <button class="mini" id="theme-load" title="قراءة ألوان ثيم العرض">⟳</button></div>
        <div class="r" style="gap:3px" id="theme-target">
          <span class="chip active" data-target="icon-color">الأيقونة</span>
          <span class="chip" data-target="bg-color">الشكل</span>
          <span class="chip" data-target="outline-color">الإطار</span></div>
        <div class="theme-status" id="theme-status">اضغطي ⟳ لقراءة ألوان الثيم.</div>
      </div>
    </div>

    <!-- كتلة الشكل الحاوي -->
    <div class="blk" id="blk-shape" data-key="shape" style="flex:1">
      <div class="bh">⬛ الشكل الحاوي<span class="sp"><span class="chev" data-toggle="shape">▾</span></span></div>
      <div class="bb">
        <div class="sgrid" id="shape-grid"></div>
        <div class="r" style="gap:4px"><span class="lbl">لون الشكل</span>
          <input type="color" id="bg-color" value="#ffffff"></div>
        <div class="r" style="gap:4px"><span class="lbl">الإطار</span>
          <input type="color" id="outline-color" value="#000000">
          <select id="outline-width">
            <option value="0">بلا</option><option value="1">1px</option><option value="2">2px</option>
            <option value="3">3px</option><option value="4">4px</option><option value="5">5px</option>
            <option value="6">6px</option><option value="8">8px</option><option value="10">10px</option>
          </select></div>
        <div class="r" style="gap:4px">
          <span class="lbl"><input type="checkbox" id="apply-shadow"> ظل</span></div>
      </div>
    </div>
  </div>

</div>

<div class="tabs" id="tabs">
  <button class="tab-btn active" onclick="switchTab('logos')" id="tab-logos">الشعارات</button>
  <button class="tab-btn" onclick="switchTab('icons')" id="tab-icons">الأيقونات</button>
  <button class="tab-btn" onclick="switchTab('shapes')" id="tab-shapes">الأشكال</button>
</div>

<div class="main">
  <div id="section-logos">
    <input type="search" class="search-box" id="search-logos" placeholder="بحث بالاسم…" oninput="filterGrid('logos')">
    <div id="grid-logos" class="icon-grid"></div>
    <div class="empty-hint" id="hint-logos">
      <button class="btn-select" onclick="pickFolder('logos')">تحديد مجلد الشعارات</button>
      اختاري مجلد الشعارات (ملفات SVG).</div>
  </div>
  <div id="section-icons" style="display:none">
    <input type="search" class="search-box" id="search-icons" placeholder="بحث بالاسم…" oninput="filterGrid('icons')">
    <div id="grid-icons-container"></div>
    <div class="empty-hint" id="hint-icons">
      <button class="btn-select" onclick="pickFolder('icons')">تحديد مجلد الأيقونات</button>
      كل مجلد فرعي يظهر كمجموعة مستقلة.</div>
  </div>
  <div id="section-shapes" style="display:none">
    <input type="search" class="search-box" id="search-shapes" placeholder="بحث بالاسم…" oninput="filterGrid('shapes')">
    <div id="grid-shapes" class="icon-grid"></div>
    <div class="empty-hint" id="hint-shapes">
      <button class="btn-select" onclick="pickFolder('shapes')">تحديد مجلد الأشكال</button>
      الأشكال تُدرج كما هي بدون تلوين أو تحجيم.</div>
  </div>
</div>
</div>
<div id="notification"></div>

<script>
/* ==================== حالة عامة ==================== */
const TABS = ['logos','icons','shapes'];
let currentTab = 'logos';
let notifSeq = 0;
const objectUrls = [];
const SIZE_MIN = 10, SIZE_MAX = 200;

const SAMPLE_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">'
  + '<path fill="#000" d="M12 2 2 7v10l10 5 10-5V7L12 2zm0 2.3 7.5 3.7-7.5 3.8L4.5 8 12 4.3zM4 9.6l7 3.5v6.3l-7-3.5V9.6zm9 9.8v-6.3l7-3.5v6.3l-7 3.5z"/></svg>';

const SHAPES = [
  {v:'none',g:'—',n:'لا شيء',pad:0},
  {v:'circle',g:'●',n:'دائرة',pad:.40},
  {v:'square',g:'■',n:'مربع',pad:.40},
  {v:'rounded',g:'▢',n:'مربع ناعم',pad:.40},
  {v:'diamond',g:'◆',n:'معيّن',pad:.62},
  {v:'hexagon',g:'⬢',n:'سداسي',pad:.42},
  {v:'octagon',g:'⯄',n:'مثمّن',pad:.40},
  {v:'ring',g:'◎',n:'حلقة مزدوجة',pad:.46},
  {v:'shield',g:'🛡',n:'درع',pad:.55}
];

function $(id){ return document.getElementById(id); }

function showNotification(msg){
  const n = $('notification');
  n.textContent = msg; n.style.display = 'block';
  const my = ++notifSeq;
  setTimeout(() => { if (my === notifSeq) n.style.display = 'none'; }, 3500);
}

/* ==================== تخزين محلي ==================== */
function lsGet(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ==================== الوضع الداكن ==================== */
function applyTheme(dark){
  document.body.classList.toggle('dark', !!dark);
  $('theme-toggle').textContent = dark ? '☀' : '🌙';
  lsSet('shz_dark', !!dark);
  renderPresets(); renderPreview();
}
function detectOfficeDark(){
  try {
    const bg = Office.context.officeTheme && Office.context.officeTheme.bodyBackgroundColor;
    if (!bg) return null;
    const h = String(bg).replace('#','');
    if (!/^[0-9a-f]{6}$/i.test(h)) return null;
    const l = (parseInt(h.slice(0,2),16)*.299 + parseInt(h.slice(2,4),16)*.587 + parseInt(h.slice(4,6),16)*.114);
    return l < 128;
  } catch(e){ return null; }
}

/* ==================== طيّ الكتل ==================== */
function applyCollapse(){
  const st = lsGet('shz_collapse', {});
  document.querySelectorAll('.blk').forEach(b => {
    const k = b.dataset.key;
    const closed = !!st[k];
    b.classList.toggle('closed', closed);
    const ch = b.querySelector('.chev');
    if (ch) ch.textContent = closed ? '▸' : '▾';
  });
}
function toggleBlock(key){
  const st = lsGet('shz_collapse', {});
  st[key] = !st[key];
  lsSet('shz_collapse', st);
  applyCollapse();
  setTimeout(updateScrollbar, 30);
}

/* ==================== إعدادات مستقلة لكل تبويب ==================== */
const CONTROL_IDS = ['icon-width','apply-color','icon-color','bg-color','outline-color','outline-width','apply-shadow'];
const SHADOW_BLUR = 2.5, SHADOW_SLOPE = 0.35, SHADOW_OFFSET = 2;
const tabSettings = {};

function snapshotSettings(){
  const s = {};
  CONTROL_IDS.forEach(id => { const el = $(id); if (!el) return; s[id] = (el.type === 'checkbox') ? el.checked : el.value; });
  const r = document.querySelector('input[name="bg-shape"]:checked');
  s.shape = r ? r.value : 'none';
  return s;
}
function restoreSettings(s){
  if (!s) return;
  CONTROL_IDS.forEach(id => {
    if (!(id in s)) return;
    const el = $(id); if (!el) return;
    if (el.type === 'checkbox') el.checked = s[id]; else el.value = s[id];
  });
  const r = document.querySelector('input[name="bg-shape"][value="' + (s.shape || 'none') + '"]');
  if (r) r.checked = true;
  syncShapeUI(); syncSizeUI(); renderPreview();
}

/* ==================== الحجم ==================== */
function clampSize(v){ let n = parseInt(v,10); if (!isFinite(n)) n = 50; return Math.max(SIZE_MIN, Math.min(SIZE_MAX, n)); }
function buildSizePresets(){
  const sel = $('size-preset');
  sel.innerHTML = '<option value="">يدوي</option>';
  for (let v = SIZE_MIN; v <= SIZE_MAX; v += 10){
    const o = document.createElement('option'); o.value = String(v); o.textContent = v + ' px'; sel.appendChild(o);
  }
  sel.onchange = () => { if (!sel.value) { $('icon-width').focus(); return; } $('icon-width').value = sel.value; renderPreview(); };
  const num = $('icon-width');
  num.oninput = () => { syncSizeUI(); renderPreview(); };
  num.onchange = () => { num.value = String(clampSize(num.value)); syncSizeUI(); renderPreview(); };
}
function syncSizeUI(){
  const num = $('icon-width'), sel = $('size-preset');
  if (!num || !sel) return;
  const v = parseInt(num.value,10);
  const m = Array.from(sel.options).filter(o => o.value && parseInt(o.value,10) === v)[0];
  sel.value = m ? m.value : '';
}

/* ==================== شبكة الأشكال ==================== */
function buildShapeGrid(){
  const g = $('shape-grid');
  g.innerHTML = '';
  SHAPES.forEach((s, i) => {
    const l = document.createElement('label');
    l.title = s.n;
    l.innerHTML = '<input type="radio" name="bg-shape" value="' + s.v + '"' + (i === 0 ? ' checked' : '') + '><span>' + s.g + '</span>';
    l.querySelector('input').onchange = () => { syncShapeUI(); renderPreview(); };
    g.appendChild(l);
  });
}
function syncShapeUI(){
  document.querySelectorAll('#shape-grid label').forEach(l => {
    l.classList.toggle('on', l.querySelector('input').checked);
  });
}
function padFor(shape){
  const s = SHAPES.filter(x => x.v === shape)[0];
  return s ? s.pad : .40;
}

/* ==================== التبويبات ==================== */
function switchTab(tabName){
  if (currentTab) tabSettings[currentTab] = snapshotSettings();
  currentTab = tabName;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  $('tab-' + tabName).classList.add('active');

/* ==================== ذاكرة المجلد (IndexedDB) ==================== */
function idbOpen(){
  return new Promise((res, rej) => {
    const r = indexedDB.open('shzLib', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v){
  try { const db = await idbOpen(); await new Promise((res, rej) => {
    const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch(e){}
}
async function idbGet(k){
  try { const db = await idbOpen(); return await new Promise((res, rej) => {
    const tx = db.transaction('kv','readonly'); const q = tx.objectStore('kv').get(k);
    q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); } catch(e){ return null; }
}

async function collectFromDirHandle(handle, prefix){
  let out = [];
  for await (const entry of handle.values()){
    if (entry.kind === 'file'){
      if (entry.name.toLowerCase().endsWith('.svg')) out.push({ dir: prefix, name: entry.name, file: await entry.getFile() });
    } else if (entry.kind === 'directory'){
      const sub = await handle.getDirectoryHandle(entry.name);
      out = out.concat(await collectFromDirHandle(sub, prefix ? prefix + '/' + entry.name : entry.name));
    }
  }
  return out;
}
function pickViaInput(){
  return new Promise((resolve) => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.multiple = true; inp.accept = '.svg,image/svg+xml';
    inp.setAttribute('webkitdirectory',''); inp.setAttribute('directory','');
    inp.style.display = 'none';
    document.body.appendChild(inp);
    inp.addEventListener('change', () => {
      const files = Array.from(inp.files || []).filter(f => f.name.toLowerCase().endsWith('.svg'));
      let root = '';
      const out = files.map(f => {
        const rel = f.webkitRelativePath || f.name;
        const parts = rel.split('/');
        parts.pop();
        if (parts.length) root = root || parts[0];
        if (parts.length) parts.shift();
        return { dir: parts.join('/'), name: f.name, file: f };
      });
      inp.remove();
      resolve({ items: out, handle: null, name: root || 'مجلد' });
    });
    inp.click();
  });
}
async function pickSvgs(){
  if (typeof window.showDirectoryPicker === 'function'){
    try {
      const handle = await window.showDirectoryPicker();
      return { items: await collectFromDirHandle(handle, ''), handle: handle, name: handle.name };
    } catch(e){
      if (e && e.name === 'AbortError') return null;
    }
  }
  return await pickViaInput();
}

async function pickFolder(tab){
  const res = await pickSvgs();
  if (!res) return;
  dirHandles[tab] = res.handle || null;
  if (res.handle) { try { await idbSet('dir_' + tab, res.handle); } catch(e){} }
  await renderItems(tab, res.items, res.name);
}
async function reloadFolder(tab){
  const h = dirHandles[tab];
  if (!h) { showNotification('لا يوجد مجلد محفوظ — اضغطي «تغيير»'); return; }
  try {
    if (h.queryPermission){
      let p = await h.queryPermission({ mode: 'read' });
      if (p !== 'granted' && h.requestPermission) p = await h.requestPermission({ mode: 'read' });
      if (p !== 'granted') { showNotification('لم يُسمح بالوصول للمجلد'); return; }
    }
    const items = await collectFromDirHandle(h, '');
    await renderItems(tab, items, h.name);
  } catch(err){ showNotification('تعذّرت إعادة القراءة: ' + err.message); }
}
async function restoreLastFolder(tab){
  const h = await idbGet('dir_' + tab);
  if (!h) return;
  dirHandles[tab] = h;
  folderInfo[tab] = { name: h.name, count: 0 };
  updateFolderBar();
  try {
    if (h.queryPermission){
      const p = await h.queryPermission({ mode: 'read' });
      if (p !== 'granted'){
        const hint = $('hint-' + tab);
        if (hint) hint.innerHTML = '<button class="btn-select" onclick="reloadFolder(\'' + tab + '\')">'
          + 'استعادة المجلد السابق: ' + h.name + '</button>اضغطي للسماح بقراءته من جديد.';
        return;
      }
    }
    const items = await collectFromDirHandle(h, '');
    await renderItems(tab, items, h.name);
  } catch(e){}
}

function clearUrls(){ while (objectUrls.length){ try { URL.revokeObjectURL(objectUrls.pop()); } catch(e){} } }

function makeBox(item, tab){
  const box = document.createElement('div');
  box.className = 'icon-box';
  box.dataset.name = item.name.replace(/\.svg$/i,'');
  box.title = item.dir ? item.dir + '/' + item.name : item.name;
  const img = document.createElement('img');
  const url = URL.createObjectURL(item.file);
  objectUrls.push(url);
  img.src = url; img.alt = item.name;
  box.appendChild(img);
  box.onmouseenter = async () => {
    try {
      if (!item._text) item._text = await item.file.text();
      previewSample = item._text;
      renderPreview();
    } catch(e){}
  };
  box.onclick = async () => {
    if (multiMode[tab]) { toggleSelect(tab, item, box); return; }
    try { if (!item._text) item._text = await item.file.text(); insert(item._text); }
    catch(err){ showNotification('تعذّرت قراءة الملف: ' + item.name); }
  };
  return box;
}

    });

      c.appendChild(title); c.appendChild(grid);

/* ==================== محرّك SVG (مُختبَر) ==================== */
        const DARK_RE = /^(#000|#000000|black|#2c3030|#1a1a1a|#111|#111111|currentcolor)$/i;
        const DARK_CSS_RE = /(#000000|#000|black|#2c3030|#1a1a1a|#111111|#111|currentColor)/gi;
        const SHAPE_TAGS = ['path', 'circle', 'rect', 'polygon', 'polyline', 'ellipse', 'line'];

        function parseSvg(svgString) {
            const doc = new DOMParser().parseFromString(svgString, 'image/svg+xml');
            if (doc.getElementsByTagName('parsererror').length) return null;
            return doc;
        }

        // محرك تلوين SVG: يستبدل الأسود/الداكن/currentColor باللون المختار
        function deepColorSVG(svgString, fillColor) {
            const doc = parseSvg(svgString);
            if (!doc) return svgString;

            doc.querySelectorAll('*').forEach(el => {
                const tag = el.tagName.toLowerCase();

                const fill = el.getAttribute('fill');
                if (fill && DARK_RE.test(fill.trim())) el.setAttribute('fill', fillColor);

                const stroke = el.getAttribute('stroke');
                if (stroke && DARK_RE.test(stroke.trim())) el.setAttribute('stroke', fillColor);

                const style = el.getAttribute('style');
                if (style) {
                    let s = style;
                    s = s.replace(/fill\s*:\s*([^;]+)/gi, (m, v) => DARK_RE.test(v.trim()) ? 'fill:' + fillColor : m);
                    s = s.replace(/stroke\s*:\s*([^;]+)/gi, (m, v) => DARK_RE.test(v.trim()) ? 'stroke:' + fillColor : m);
                    el.setAttribute('style', s);
                }

                if (tag === 'style') {
                    let css = el.textContent || '';
                    css = css.replace(/fill\s*:\s*([^;}]+)/gi, (m, v) => DARK_RE.test(v.trim()) ? 'fill:' + fillColor : m);
                    css = css.replace(/stroke\s*:\s*([^;}]+)/gi, (m, v) => DARK_RE.test(v.trim()) ? 'stroke:' + fillColor : m);
                    el.textContent = css;
                }

                // أيقونات تعتمد اللون الأسود الافتراضي (بلا fill ولا class ولا style)
                if (SHAPE_TAGS.indexOf(tag) !== -1 && !el.getAttribute('fill') && !el.getAttribute('class')
                    && !(el.getAttribute('style') || '').match(/fill\s*:/i)) {
                    const st = el.getAttribute('stroke');
                    if (!st || st === 'none') el.setAttribute('fill', fillColor);
                }
            });

            return new XMLSerializer().serializeToString(doc);
        }

        function getViewBox(doc) {
            const el = doc.documentElement;
            const vb = el.getAttribute('viewBox');
            if (vb && vb.trim()) return vb.trim();
            const w = parseFloat(el.getAttribute('width'));
            const h = parseFloat(el.getAttribute('height'));
            if (w > 0 && h > 0) return '0 0 ' + w + ' ' + h;
            return '0 0 100 100';
        }

        // ضبط مقاس الأيقونة مع الحفاظ على النسبة — يجعل خانة "الحجم" فعّالة دائماً
        function resizeSvg(svgString, w) {
            const doc = parseSvg(svgString);
            if (!doc) return svgString;
            const el = doc.documentElement;
            const vb = getViewBox(doc).split(/[\s,]+/).map(Number);
            const ratio = (vb[2] > 0 && vb[3] > 0) ? (vb[3] / vb[2]) : 1;
            el.setAttribute('viewBox', getViewBox(doc));
            el.setAttribute('width', String(w));
            el.setAttribute('height', String(Math.round(w * ratio)));
            if (!el.getAttribute('xmlns')) el.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
            return new XMLSerializer().serializeToString(doc);
        }

        function innerOf(svgString) {
            const doc = parseSvg(svgString);
            if (!doc) return { inner: '', viewBox: '0 0 100 100' };
            const el = doc.documentElement;
            let inner = '';
            for (let i = 0; i < el.childNodes.length; i++) {
                inner += new XMLSerializer().serializeToString(el.childNodes[i]);
            }
            return { inner: inner, viewBox: getViewBox(doc) };
        }

/* ==================== ألوان ثيم العرض ==================== */
        const THEME_SLOTS = [

        /* --- قارئ ZIP مصغّر: لا يحتاج أي مكتبة خارجية --- */
        function zipIndex(bytes) {
            const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            let eocd = -1;
            const floor = Math.max(0, bytes.length - 66000);
            for (let i = bytes.length - 22; i >= floor; i--) {
                if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) { eocd = i; break; }
            }
            if (eocd < 0) throw new Error('الملف ليس أرشيف ZIP صالحاً');
            const count = dv.getUint16(eocd + 10, true);
            let p = dv.getUint32(eocd + 16, true);
            const map = {};
            const dec = new TextDecoder('utf-8');
            for (let i = 0; i < count && p + 46 <= bytes.length; i++) {
                if (dv.getUint32(p, true) !== 0x02014b50) break;
                const nameLen = dv.getUint16(p + 28, true);
                const extraLen = dv.getUint16(p + 30, true);
                const cmtLen = dv.getUint16(p + 32, true);
                map[dec.decode(bytes.subarray(p + 46, p + 46 + nameLen))] = {
                    method: dv.getUint16(p + 10, true),
                    compSize: dv.getUint32(p + 20, true),
                    lho: dv.getUint32(p + 42, true)
                };
                p += 46 + nameLen + extraLen + cmtLen;
            }
            return map;
        }

        async function zipText(bytes, entry) {
            if (!entry) return null;
            const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
            const nameLen = dv.getUint16(entry.lho + 26, true);
            const extraLen = dv.getUint16(entry.lho + 28, true);
            const start = entry.lho + 30 + nameLen + extraLen;
            const data = bytes.subarray(start, start + entry.compSize);
            if (entry.method === 0) return new TextDecoder('utf-8').decode(data);
            if (typeof DecompressionStream === 'undefined') throw new Error('المتصفح لا يدعم فك الضغط');
            const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
            return new TextDecoder('utf-8').decode(await new Response(stream).arrayBuffer());
        }

        function getPresentationBytes() {
            return new Promise((resolve, reject) => {
                Office.context.document.getFileAsync(Office.FileType.Compressed, { sliceSize: 3 * 1024 * 1024 }, (res) => {
                    if (res.status !== Office.AsyncResultStatus.Succeeded) {
                        return reject(new Error((res.error && res.error.message) || 'تعذّرت قراءة العرض'));
                    }
                    const file = res.value;
                    const parts = [];
                    let total = 0;
                    const step = (i) => {
                        if (i >= file.sliceCount) {
                            file.closeAsync();
                            const out = new Uint8Array(total);
                            let off = 0;
                            parts.forEach(u => { out.set(u, off); off += u.length; });
                            return resolve(out);
                        }
                        file.getSliceAsync(i, (r) => {
                            if (r.status !== Office.AsyncResultStatus.Succeeded) {
                                file.closeAsync();
                                return reject(new Error((r.error && r.error.message) || 'تعذّرت قراءة العرض'));
                            }
                            const u = (r.value.data instanceof Uint8Array) ? r.value.data : new Uint8Array(r.value.data);
                            parts.push(u); total += u.length;
                            step(i + 1);
                        });
                    };
                    step(0);
                });
            });
        }

        function getActiveSlideIndex() {
            return new Promise((resolve) => {
                try {
                    Office.context.document.getSelectedDataAsync(Office.CoercionType.SlideRange, (r) => {
                        try {
                            if (r.status === Office.AsyncResultStatus.Succeeded && r.value && r.value.slides && r.value.slides.length) {
                                resolve(r.value.slides[0].index || null);
                            } else resolve(null);
                        } catch (e) { resolve(null); }
                    });
                } catch (e) { resolve(null); }
            });
        }

        function relsPathFor(part) {
            const i = part.lastIndexOf('/');
            return part.slice(0, i + 1) + '_rels/' + part.slice(i + 1) + '.rels';
        }

        function resolvePath(basePart, target) {
            if (target.charAt(0) === '/') return target.slice(1);
            const stack = basePart.split('/').slice(0, -1);
            target.split('/').forEach(seg => {
                if (seg === '.' || seg === '') return;
                if (seg === '..') stack.pop();
                else stack.push(seg);
            });
            return stack.join('/');
        }

        function parseRels(xml, basePart) {
            const out = [];
            const re = /<Relationship\b[^>]*>/g;
            let m;
            while ((m = re.exec(xml))) {
                const tag = m[0];
                const id = (tag.match(/Id="([^"]+)"/) || [])[1];
                const type = (tag.match(/Type="([^"]+)"/) || [])[1] || '';
                const target = (tag.match(/Target="([^"]+)"/) || [])[1];
                const mode = (tag.match(/TargetMode="([^"]+)"/) || [])[1];
                if (!target || mode === 'External') continue;
                out.push({ id: id, type: type, part: resolvePath(basePart, target) });
            }
            return out;
        }

        async function followTo(bytes, idx, part, typeSuffix) {
            const rels = await zipText(bytes, idx[relsPathFor(part)]);
            if (!rels) return null;
            const hit = parseRels(rels, part).filter(r => r.type.indexOf(typeSuffix) !== -1)[0];
            return hit ? hit.part : null;
        }

        // يحدّد ملف الثيم الفعلي للشريحة النشطة: slide ← layout ← master ← theme
        async function findThemePart(bytes, idx, slideIndex) {
            try {
                if (slideIndex) {
                    const pres = await zipText(bytes, idx['ppt/presentation.xml']);
                    const rels = await zipText(bytes, idx['ppt/_rels/presentation.xml.rels']);
                    if (pres && rels) {
                        const relList = parseRels(rels, 'ppt/presentation.xml');
                        const ids = [];
                        const re = /<p:sldId\b[^>]*r:id="([^"]+)"/g;
                        let m;
                        while ((m = re.exec(pres))) ids.push(m[1]);
                        const rid = ids[slideIndex - 1];
                        const slide = rid && (relList.filter(r => r.id === rid)[0] || {}).part;
                        if (slide) {
                            const layout = await followTo(bytes, idx, slide, 'slideLayout');
                            if (layout) {
                                const master = await followTo(bytes, idx, layout, 'slideMaster');
                                if (master) {
                                    const theme = await followTo(bytes, idx, master, 'theme');
                                    if (theme && idx[theme]) return { part: theme, exact: true };
                                }
                            }
                        }
                    }
                }
            } catch (e) { /* نكمل للاحتياطي */ }

            if (idx['ppt/theme/theme1.xml']) return { part: 'ppt/theme/theme1.xml', exact: false };
            const any = Object.keys(idx).filter(n => /^ppt\/theme\/theme\d+\.xml$/.test(n)).sort()[0];
            return any ? { part: any, exact: false } : null;
        }

        function parseThemeColors(xml) {
            const block = xml.match(/<a:clrScheme[\s\S]*?<\/a:clrScheme>/);
            const scope = block ? block[0] : xml;
            const out = {};
            THEME_SLOTS.forEach(s => {
                const re = new RegExp('<a:' + s.key + '\\b[^>]*>([\\s\\S]*?)</a:' + s.key + '>');
                const m = scope.match(re);
                if (!m) return;
                let hex = (m[1].match(/<a:srgbClr\s+val="([0-9A-Fa-f]{6})"/) || [])[1];
                if (!hex) hex = (m[1].match(/<a:sysClr\b[^>]*lastClr="([0-9A-Fa-f]{6})"/) || [])[1];
                if (hex) out[s.key] = '#' + hex.toUpperCase();
            });
            return out;
        }

        function renderSwatches() {
            const wrap = document.getElementById('theme-swatches');
            wrap.innerHTML = '';
            if (!themeColors) return;
            THEME_SLOTS.forEach(s => {
                const hex = themeColors[s.key];
                if (!hex) return;
                const d = document.createElement('div');
                d.className = 'swatch';
                d.style.backgroundColor = hex;
                d.title = SLOT_NAMES[s.key] + ' — ' + hex;
                const tag = document.createElement('span');
                tag.textContent = s.label;
                d.appendChild(tag);
                d.onclick = () => {
                    const input = document.getElementById(themeTarget);
                    if (!input) return;
                    input.value = hex.toLowerCase();
                    if (themeTarget === 'icon-color') document.getElementById('apply-color').checked = true;
                    if (themeTarget === 'outline-color' && document.getElementById('outline-width').value === '0') {
                        document.getElementById('outline-width').value = '2';
                    }
                    showNotification(SLOT_NAMES[s.key] + ' → ' + hex);
                };
                wrap.appendChild(d);
            });
        }

        async function loadThemeColors(userTriggered) {
            if (themeLoading) return;
            const status = document.getElementById('theme-status');
            const btn = document.getElementById('theme-load');
            themeLoading = true;
            btn.disabled = true;
            status.textContent = 'جارٍ قراءة ألوان الثيم…';
            try {
                if (!window.Office || !Office.context || !Office.context.document || !Office.context.document.getFileAsync) {
                    throw new Error('غير متاح خارج بوربوينت');
                }
                const slideIndex = await getActiveSlideIndex();
                const bytes = await getPresentationBytes();
                const idx = zipIndex(bytes);
                const found = await findThemePart(bytes, idx, slideIndex);
                if (!found) throw new Error('لم يُعثر على ملف الثيم داخل العرض');
                const xml = await zipText(bytes, idx[found.part]);
                const colors = parseThemeColors(xml || '');
                if (!colors.accent1) throw new Error('تعذّر قراءة مجموعة الألوان');
                themeColors = colors;
                renderSwatches();
                if (userTriggered) {
                    document.getElementById('icon-color').value = colors.accent1.toLowerCase();
                    document.getElementById('apply-color').checked = true;
                }
                status.textContent = 'تم — ' + (found.exact ? 'ثيم الشريحة النشطة' : 'الثيم الرئيسي للعرض')
                    + '. اختاري الهدف ثم اضغطي أي لون.';
            } catch (err) {
                status.textContent = 'تعذّرت القراءة: ' + err.message + ' — يمكنك اختيار اللون يدوياً.';
                if (userTriggered) showNotification('تعذّرت قراءة ألوان الثيم: ' + err.message);
            } finally {
                themeLoading = false;
                btn.disabled = false;
            }
        }


/* ==================== دمج عدة أيقونات ==================== */
function isolateUnit(svgString, idx){
  const doc = parseSvg(svgString);
  if (!doc) return svgString;
  const pre = 'u' + idx + '_';
  const ids = [];
  doc.querySelectorAll('[id]').forEach(el => ids.push(el.getAttribute('id')));
  if (ids.length){
    doc.querySelectorAll('*').forEach(el => {
      for (let i = 0; i < el.attributes.length; i++){
        const at = el.attributes[i];
        let v = at.value;
        if (v.indexOf('#') === -1) continue;
        ids.forEach(id => {
          v = v.split('url(#' + id + ')').join('url(#' + pre + id + ')');
          if (v === '#' + id) v = '#' + pre + id;
        });
        if (v !== at.value) el.setAttribute(at.name, v);
      }
    });
    doc.querySelectorAll('[id]').forEach(el => el.setAttribute('id', pre + el.getAttribute('id')));
  }
  doc.querySelectorAll('[class]').forEach(el => {
    el.setAttribute('class', (el.getAttribute('class')||'').trim().split(/\s+/).filter(Boolean).map(c => pre + c).join(' '));
  });
  doc.querySelectorAll('style').forEach(el => {
    el.textContent = (el.textContent || '').replace(/\.([A-Za-z_][\w-]*)/g, '.' + pre + '$1');
  });
  return new XMLSerializer().serializeToString(doc);
}
function unitSize(svgString){
  const doc = parseSvg(svgString);
  if (!doc) return null;
  const el = doc.documentElement;
  let w = parseFloat(el.getAttribute('width')), h = parseFloat(el.getAttribute('height'));
  const vb = getViewBox(doc);
  if (!(w > 0) || !(h > 0)){
    const n = vb.split(/[\s,]+/).map(Number);
    w = n[2] > 0 ? n[2] : 100; h = n[3] > 0 ? n[3] : 100;
  }
  return { w:w, h:h, viewBox:vb, doc:doc };
}
function composeGrid(units, cols){
  const parsed = units.map((u,i) => unitSize(isolateUnit(u,i))).filter(Boolean);
  if (!parsed.length) return null;
  if (parsed.length === 1) return new XMLSerializer().serializeToString(parsed[0].doc);
  const cellW = Math.max.apply(null, parsed.map(p => p.w));
  const cellH = Math.max.apply(null, parsed.map(p => p.h));
  const n = parsed.length;
  const c = (cols > 0) ? Math.min(cols, n) : Math.ceil(Math.sqrt(n));
  const rows = Math.ceil(n / c);
  const gap = Math.max(4, Math.round(Math.max(cellW, cellH) * .15));
  const totalW = c * cellW + (c - 1) * gap;
  const totalH = rows * cellH + (rows - 1) * gap;
  let body = '';
  parsed.forEach((p,i) => {
    const col = i % c, row = Math.floor(i / c);
    const x = Math.round((col * (cellW + gap) + (cellW - p.w) / 2) * 100) / 100;
    const y = Math.round((row * (cellH + gap) + (cellH - p.h) / 2) * 100) / 100;
    const el = p.doc.documentElement;
    el.setAttribute('width', String(p.w)); el.setAttribute('height', String(p.h));
    el.setAttribute('viewBox', p.viewBox);
    el.removeAttribute('x'); el.removeAttribute('y');
    body += '<g transform="translate(' + x + ',' + y + ')">' + new XMLSerializer().serializeToString(el) + '</g>';
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + totalW + '" height="' + totalH
    + '" viewBox="0 0 ' + totalW + ' ' + totalH + '">' + body + '</svg>';
}

let shadowSeq = 0;
function shadowFilter(id, st){
  return '<defs><filter id="' + id + '" x="-35%" y="-35%" width="170%" height="170%">'
    + '<feGaussianBlur in="SourceAlpha" stdDeviation="' + st.blur + '" />'
    + '<feOffset dx="' + st.off + '" dy="' + st.off + '" result="offsetblur" />'
    + '<feComponentTransfer><feFuncA type="linear" slope="' + st.slope + '" /></feComponentTransfer>'
    + '<feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>'
    + '</filter></defs>';
}

function shapeMarkup(shape, c, total, inset, fill, strokeAttr, filterAttr){
  const R = total / 2 - inset;
  const poly = (pts) => '<polygon points="' + pts + '" fill="' + fill + '"' + strokeAttr + filterAttr + ' stroke-linejoin="round" />';
  const ring = (d) => [0,1,2,3,4,5].map(i => { const a = (d + i * 60) * Math.PI / 180;
    return (c + R * Math.cos(a)).toFixed(1) + ',' + (c + R * Math.sin(a)).toFixed(1); }).join(' ');

  if (shape === 'circle') return '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="' + fill + '"' + strokeAttr + filterAttr + ' />';
  if (shape === 'square') return '<rect x="' + inset + '" y="' + inset + '" width="' + (total - inset*2) + '" height="' + (total - inset*2) + '" fill="' + fill + '"' + strokeAttr + filterAttr + ' />';
  if (shape === 'rounded') return '<rect x="' + inset + '" y="' + inset + '" width="' + (total - inset*2) + '" height="' + (total - inset*2) + '" rx="' + Math.round(total * .15) + '" fill="' + fill + '"' + strokeAttr + filterAttr + ' />';
  if (shape === 'diamond'){
    const side = (total - inset * 2) / Math.SQRT2;
    const x0 = Math.round((c - side / 2) * 100) / 100;
    return '<rect x="' + x0 + '" y="' + x0 + '" width="' + (Math.round(side*100)/100) + '" height="' + (Math.round(side*100)/100)
      + '" rx="' + Math.round(side * .14) + '" transform="rotate(45 ' + c + ' ' + c + ')" fill="' + fill + '"' + strokeAttr + filterAttr + ' />';
  }
  if (shape === 'hexagon') return poly(ring(0));
  if (shape === 'octagon'){
    const pts = [0,1,2,3,4,5,6,7].map(i => { const a = (22.5 + i * 45) * Math.PI / 180;
      return (c + R * Math.cos(a)).toFixed(1) + ',' + (c + R * Math.sin(a)).toFixed(1); }).join(' ');
    return poly(pts);
  }
  if (shape === 'ring'){
    const inner = Math.max(2, R - Math.max(4, R * .12));
    return '<circle cx="' + c + '" cy="' + c + '" r="' + R + '" fill="' + fill + '"' + strokeAttr + filterAttr + ' />'
      + '<circle cx="' + c + '" cy="' + c + '" r="' + inner.toFixed(1) + '" fill="none" stroke="'
      + (strokeAttr ? (strokeAttr.match(/stroke="([^"]+)"/) || [])[1] : '#888') + '" stroke-width="'
      + Math.max(1, Math.round(R * .05)) + '" opacity="0.55" />';
  }
  if (shape === 'shield'){
    const l = inset, rr = total - inset, tp = inset, bt = total - inset;
    const sh = tp + (bt - tp) * .62, k = Math.round(total * .12);
    return '<path d="M ' + l + ' ' + (tp + k) + ' Q ' + l + ' ' + tp + ' ' + (l + k) + ' ' + tp
      + ' L ' + (rr - k) + ' ' + tp + ' Q ' + rr + ' ' + tp + ' ' + rr + ' ' + (tp + k)
      + ' L ' + rr + ' ' + sh + ' Q ' + rr + ' ' + (bt - k * .6) + ' ' + c + ' ' + bt
      + ' Q ' + l + ' ' + (bt - k * .6) + ' ' + l + ' ' + sh + ' Z" fill="' + fill + '"'
      + strokeAttr + filterAttr + ' stroke-linejoin="round" />';
  }
  return '';
}

function buildWith(svg, st, styled){
  const w = st.w;
  const applyColor = styled && st.applyColor;
  const shape = styled ? st.shape : 'none';
  const shadowOn = styled && st.shadowOn;
  let processed = applyColor ? deepColorSVG(svg, st.iconColor) : svg;

  if (shape === 'none' && !shadowOn) return resizeSvg(processed, w);

  const parts = innerOf(processed);
  const fid = 'shz-shadow-' + (++shadowSeq);
  const fdef = shadowOn ? shadowFilter(fid, st) : '';
  const fattr = shadowOn ? ' filter="url(#' + fid + ')"' : '';

  if (shape === 'none'){
    const pad = Math.max(4, Math.round(w * (.12 + st.blur * .02)));
    const total = w + pad * 2;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + total + '" height="' + total + '" viewBox="0 0 ' + total + ' ' + total + '">'
      + fdef + '<g transform="translate(' + pad + ',' + pad + ')"' + fattr + '>'
      + '<svg width="' + w + '" height="' + w + '" viewBox="' + parts.viewBox + '" preserveAspectRatio="xMidYMid meet">' + parts.inner + '</svg>'
      + '</g></svg>';
  }

  const padding = Math.round(w * padFor(shape));
  const total = w + padding * 2;
  const c = total / 2;
  const inset = Math.max(5, st.outlineWidth);
  const strokeAttr = st.outlineWidth > 0 ? ' stroke="' + st.outlineColor + '" stroke-width="' + st.outlineWidth + '"' : '';
  const shapeHtml = shapeMarkup(shape, c, total, inset, st.shapeFill, strokeAttr, fattr);
  const shiftY = (shape === 'shield') ? -Math.round(w * .07) : 0;

  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + total + '" height="' + total + '" viewBox="0 0 ' + total + ' ' + total + '">'
    + fdef + shapeHtml
    + '<g transform="translate(' + padding + ',' + (padding + shiftY) + ')">'
    + '<svg width="' + w + '" height="' + w + '" viewBox="' + parts.viewBox + '" preserveAspectRatio="xMidYMid meet">' + parts.inner + '</svg>'
    + '</g></svg>';
}

function buildContent(svg){
  if (currentTab === 'shapes') return svg;
  return buildWith(svg, currentSettings(), currentTab === 'icons');
}

/* ==================== شريط التمرير ==================== */
function updateScrollbar(){
  const sc = $('scroller'), bar = $('sbar'), th = $('sthumb');
  if (!sc || !bar) return;
  const trackH = bar.clientHeight;
  const ratio = sc.clientHeight / sc.scrollHeight;
  if (ratio >= 0.999){ bar.style.display = 'none'; return; }
  bar.style.display = 'block';
  const h = Math.max(34, Math.round(trackH * ratio));
  const max = sc.scrollHeight - sc.clientHeight;
  const top = max > 0 ? Math.round((sc.scrollTop / max) * (trackH - h)) : 0;
  th.style.height = h + 'px';
  th.style.top = top + 'px';
}
function wireScrollbar(){
  const sc = $('scroller'), bar = $('sbar'), th = $('sthumb');
  let dragging = false, startY = 0, startTop = 0;

  th.addEventListener('pointerdown', (e) => {
    dragging = true; startY = e.clientY; startTop = th.offsetTop;
    th.classList.add('drag');
    th.setPointerCapture(e.pointerId);
    e.preventDefault(); e.stopPropagation();
  });
  th.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const trackH = bar.clientHeight, h = th.offsetHeight;
    const span = trackH - h;
    if (span <= 0) return;
    const top = Math.max(0, Math.min(span, startTop + (e.clientY - startY)));
    sc.scrollTop = (top / span) * (sc.scrollHeight - sc.clientHeight);
  });
  const stop = (e) => { if (!dragging) return; dragging = false; th.classList.remove('drag');
    try { th.releasePointerCapture(e.pointerId); } catch(err){} };
  th.addEventListener('pointerup', stop);
  th.addEventListener('pointercancel', stop);

  bar.addEventListener('pointerdown', (e) => {
    if (e.target === th) return;
    const rect = bar.getBoundingClientRect();
    const h = th.offsetHeight, span = bar.clientHeight - h;
    const top = Math.max(0, Math.min(span, e.clientY - rect.top - h / 2));
    sc.scrollTop = span > 0 ? (top / span) * (sc.scrollHeight - sc.clientHeight) : 0;
  });

  sc.addEventListener('scroll', updateScrollbar);
  window.addEventListener('resize', updateScrollbar);
  if (window.ResizeObserver){
    const ro = new ResizeObserver(updateScrollbar);
    ro.observe(sc);
    Array.from(sc.children).forEach(c => ro.observe(c));
  }
  updateScrollbar();
}

  $('theme-toggle').onclick = () => applyTheme(!document.body.classList.contains('dark'));
  $('folder-change').onclick = () => pickFolder(currentTab);
  $('folder-reload').onclick = () => reloadFolder(currentTab);
  $('preset-save').onclick = savePreset;
  $('theme-load').onclick = () => loadThemeColors(true);
  document.querySelectorAll('#theme-target .chip').forEach(ch => {
    ch.onclick = () => {
      document.querySelectorAll('#theme-target .chip').forEach(c => c.classList.remove('active'));
      ch.classList.add('active');
      themeTarget = ch.dataset.target;
    };
  });
}

function initUI(){
  buildSizePresets();
  buildShapeGrid();
  buildZoomBars();
  buildBatchBars();
  wireControls();
  wireScrollbar();
  applyCollapse();
  if (!localStorage.getItem('shz_presets')) setPresets(defaultPresets()); else renderPresets();
  syncSizeUI(); syncShapeUI();
  const base = snapshotSettings();
  TABS.forEach(t => { if (!tabSettings[t]) tabSettings[t] = JSON.parse(JSON.stringify(base)); });
  TABS.forEach(t => updateBatchUI(t));
  const saved = lsGet('shz_dark', null);
  applyTheme(saved === null ? false : saved);
}

Office.onReady((info) => {
  initUI();
  try {
    if (info && info.host === Office.HostType.PowerPoint){
      if (lsGet('shz_dark', null) === null){ const d = detectOfficeDark(); if (d !== null) applyTheme(d); }
      if (Office.EventType && Office.EventType.OfficeThemeChanged){
        try { Office.context.document.addHandlerAsync(Office.EventType.OfficeThemeChanged, () => {
          if (lsGet('shz_dark', null) === null){ const d = detectOfficeDark(); if (d !== null) applyTheme(d); }
        }); } catch(e){}
      }
    }
  } catch(e){ console.error(e); }
  switchTab('logos');
  renderPreview();
  setTimeout(() => { loadThemeColors(false); }, 600);
  TABS.forEach(t => restoreLastFolder(t));
});
</script>
</body>
</html>
